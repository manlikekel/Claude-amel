<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AMEL — Offline</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#0a0606;color:#f5f0e6;}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:24px;text-align:center;}
  .gold{color:#d4a853;}
  h1{font-size:28px;margin:8px 0 4px;letter-spacing:-0.01em;}
  p{color:#9a8e7b;max-width:320px;line-height:1.45;}
  button{margin-top:20px;background:linear-gradient(135deg,#e0b860,#b9933f);color:#1a0e07;border:0;padding:12px 22px;border-radius:14px;font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="gold" style="font-size:42px">✈</div>
  <h1>You're offline</h1>
  <p>AMEL needs a stored copy of the app to load this page. Reconnect and try again — your saved logs are still safe.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
